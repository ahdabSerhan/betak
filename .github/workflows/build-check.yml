# Temporary: builds this branch once so PR #8 can be checked. Delete with the branch.
name: Build check
on:
  push:
    branches: [ci-build-pr8]
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
